[supervisord]
nodaemon=true
user=root
logfile=$SB/apps/verify_upgrade/sup/a3-restart/supervisord.log
pidfile=$SB/apps/verify_upgrade/sup/a3-restart/supervisord.pid
childlogdir=$SB/apps/verify_upgrade/sup/a3-restart
[inet_http_server]
port=127.0.0.1:8659
[supervisorctl]
serverurl=http://127.0.0.1:8659
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
[program:rx]
command=$SB/envs/a3/bin/reflex run --json --frontend-port 3640 --backend-port 8640
directory=$SB/apps/verify_upgrade/blank_a3
environment=REFLEX_TELEMETRY_ENABLED="false"
autostart=false
autorestart=false
startsecs=1
stopsignal=INT
stopwaitsecs=10
stdout_logfile=$SB/apps/verify_upgrade/sup/a3-restart/rx.out.log
stderr_logfile=$SB/apps/verify_upgrade/sup/a3-restart/rx.err.log
