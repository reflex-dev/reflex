# Examples are standalone apps that must run on published reflex releases (the
# playground back to 0.8.23), so they import Reflex only as `import reflex as rx`.
extend = "../pyproject.toml"

# Each example directory is the root of its app, so the app's own package is
# first-party and `reflex` is an installed third-party package.
src = ["*"]

[lint.extend-per-file-ignores]
# rxconfig.py sits in the app root, which is not a package.
"*/rxconfig.py" = ["INP001"]

# Every package under packages/ whose import name is not `reflex`.
[lint.flake8-tidy-imports.banned-api]
hatch_reflex_pyi.msg = "Examples import Reflex only as `import reflex as rx`."
integrations_docs.msg = "Examples import Reflex only as `import reflex as rx`."
