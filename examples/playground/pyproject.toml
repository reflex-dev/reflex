[project]
name = "reflex-playground"
version = "0.1.0"
description = "Reflex example app, also the fixture of the Reflex macro benchmarks."
readme = "README.md"
requires-python = ">=3.10"
# PyPI rejects uploads carrying this classifier: the playground is never published.
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = ["reflex>=0.8.23"]
