[project]
name = "reflex-hosting-cli"
dynamic = ["version"]
description = "Reflex Hosting CLI"
license.text = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Nikhil Rao", email = "nikhil@reflex.dev" },
    { name = "Alek Petuskey", email = "alek@reflex.dev" },
]
maintainers = [
    { name = "Simon Young", email = "simon@reflex.dev" },
    { name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "click >=8.2",
    # Imported directly by `check_version`, so it is declared here rather than
    # taken on loan from reflex-build-sdk's own pin.
    "httpx >=0.25.1,<1.0",
    "packaging >=24.2",
    "platformdirs >=3.10.0,<5.0",
    # The SDK ships no HTTP library of its own; [httpx] points it at the one
    # `check_version` already pulls in, so the extra costs nothing to install.
    # The SDK is pre-1.0, so every release may break its API: cap at the patch
    # and raise all three bounds when adopting a new one. The floor admits the
    # workspace's dev build until the 0.1.0 alpha publishes and materialization
    # lifts it; the cap admits 0.1.0 and the ``0.1.1.devN`` builds that follow
    # its tag, but not 0.1.1 itself.
    "reflex-build-sdk[httpx] >=0.1.0,<0.1.1.post,!=0.1.1",
    "rich >=13,<16",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "reflex-hosting-cli-"
fallback-version = "0.0.0dev0"
bump = true

[tool.hatch.build.targets.wheel]
packages = ["src/reflex_cli"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
