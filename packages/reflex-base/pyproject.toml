[project]
name = "reflex-base"
dynamic = ["version"]
description = "Core types for the Reflex framework."
license.text = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
maintainers = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
requires-python = ">=3.10"
dependencies = [
  "packaging >=24.2,<27",
  "rich >=13,<16",
  "typing_extensions >=4.13.0",
  "platformdirs >=4.3.7,<5.0",
]

[project.optional-dependencies]
pydantic = ["pydantic >=2.12.0,<3.0"]
# Native JSON encoder; wheels for CPython 3.11+ on Linux x86_64.
yjson = ["yjson >=0.3.1,<1.0; python_version >= '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "reflex-base-"
fallback-version = "0.0.0dev0"
bump = true

[tool.hatch.build]
artifacts = [".templates/**"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
