[project]
name = "reflex-base"
dynamic = ["version"]
description = "Core types for the Reflex framework."
license.text = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
maintainers = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
requires-python = ">=3.10"
dependencies = [
  "packaging >=26.3,<27",
  "rich >=15.0.0,<16",
  "typing_extensions >=4.16.0",
  "platformdirs >=4.12.1,<5.0",
]

[project.optional-dependencies]
pydantic = ["pydantic >=2.13.5,<3.0"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "reflex-base-"
fallback-version = "0.0.0dev0"
bump = true

[tool.hatch.build]
artifacts = [".templates/**"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
