[project]
name = "reflex-base"
dynamic = ["version"]
description = "Core types for the Reflex framework."
license.text = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
maintainers = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "packaging >=24.2,<27",
  "rich >=13,<16",
  "typing_extensions >=4.13.0",
  "platformdirs >=4.3.7,<5.0",
]

[project.optional-dependencies]
pydantic = ["pydantic >=2.12.0,<3.0"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "reflex-base-"
fallback-version = "0.0.0dev0"
bump = true

[tool.hatch.build]
artifacts = [".templates/**"]

# The frontend is a javascript package of its own, embedded here as the web
# template that `reflex init` copies into a project. The sdist carries the
# package's `src` and manifest, which is all a wheel built from it needs.
#
# An editable install receives a copy too, which nothing reads: reflex_base
# resolves to the checkout there, and `Templates.Dirs.WEB_TEMPLATE` to
# `frontend/src`.
[tool.hatch.build.targets.wheel.force-include]
"frontend/src" = "reflex_base/.templates/web"

[tool.hatch.build.targets.sdist]
exclude = [
  "/frontend/tests",
  "/frontend/package-lock.json",
  "/frontend/vitest.config.js",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
