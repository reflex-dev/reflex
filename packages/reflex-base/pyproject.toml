[project]
name = "reflex-base"
dynamic = ["version"]
description = "Core types for the Reflex framework."
license.text = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
maintainers = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
requires-python = ">=3.10"
dependencies = [
  "packaging >=24.2,<27",
  "rich >=13,<16",
  "typing_extensions >=4.13.0",
  "platformdirs >=4.3.7,<5.0",
]

[project.optional-dependencies]
pydantic = ["pydantic >=2.12.0,<3.0"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "reflex-base-"
fallback-version = "0.0.0dev0"

[tool.hatch.build]
artifacts = [".templates/**"]

# The frontend JS source ships only in the sdist; wheels instead carry the
# packed npm tarball that the custom hook force-includes at
# reflex_base/frontend/<name>-<version>.tgz. Do not add target-level
# `artifacts` here: hatchling replaces (not merges) the build-level list,
# which would drop `.templates/**` from the dist.
[tool.hatch.build.targets.wheel]
exclude = ["src/reflex_base/frontend"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
