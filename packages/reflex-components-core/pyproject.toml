[project]
name = "reflex-components-core"
dynamic = ["version"]
description = "UI components for Reflex."
license.text = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
maintainers = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
requires-python = ">=3.10"
dependencies = [
    "reflex-base >= 0.9.8.post2.dev0",
    "reflex-components-lucide >= 0.9.0",
    "reflex-components-sonner >= 0.9.0",
    "python_multipart >= 0.0.21",
    "starlette >= 0.47.0",
    "typing_extensions >= 4.0.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "reflex-components-core-"
fallback-version = "0.0.0dev0"

[tool.hatch.build]
# Generated stubs are gitignored, so they need to be named as build artifacts
# to be shipped. Anchored to `src` because hatchling matches artifacts with
# gitignore semantics and checks them before (and instead of) `include`.
artifacts = ["/src/**/*.pyi"]

[tool.hatch.build.hooks.reflex-pyi]
dependencies = [
    "ruff",
    "reflex-base",
    "reflex-components-lucide",
    "reflex-components-sonner",
    "python_multipart",
    "starlette",
    "typing_extensions",
]


[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "hatch-reflex-pyi"]
build-backend = "hatchling.build"
