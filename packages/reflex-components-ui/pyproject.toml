[project]
name = "reflex-components-ui"
dynamic = ["version"]
description = "Reflex components compiled to plain HTML and static CSS."
license.text = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
maintainers = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["reflex-base >= 0.11.1.dev0"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "reflex-components-ui-"
fallback-version = "0.0.0dev0"
bump = true

[tool.hatch.build]
# Include uncommitted pyi stubs generated for this package.
artifacts = ["/src/**/*.pyi"]

# Only what a wheel is built from: the javascript package's tests, scripts and
# tooling stay in the repository.
[tool.hatch.build.targets.sdist]
include = ["/src", "/js/src", "/hatch_build.py"]

[tool.hatch.build.hooks.reflex-pyi]
dependencies = ["ruff", "reflex-base"]

# Embeds js/src, the javascript the components are compiled against, which the
# plugin copies into a project's web directory.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "hatch-reflex-pyi"]
build-backend = "hatchling.build"
