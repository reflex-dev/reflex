[project]
name = "reflex-docgen"
dynamic = ["version"]
description = "Generate documentation for Reflex components."
license.text = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
maintainers = [{ name = "Khaleel Al-Adhami", email = "khaleel@reflex.dev" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "griffelib >= 2.0.1",
    "mistletoe >= 1.4.0",
    "pyyaml >= 6.0.3",
    "reflex >= 0.9.0",
    "typing-inspection>=0.4.2",
]

[tool.uv.sources]
reflex = { workspace = true }

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "reflex-docgen-"
fallback-version = "0.0.0dev0"
bump = true

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
