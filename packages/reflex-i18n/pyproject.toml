[project]
name = "reflex-i18n"
dynamic = ["version"]
description = "Internationalization (i18n) for Reflex apps."
license.text = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Reflex", email = "maintainers@reflex.dev" }]
maintainers = [{ name = "Reflex", email = "maintainers@reflex.dev" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  # TODO: Bump to the released versions before publishing.
  "reflex-base >= 0.10.1.dev0",
  "reflex >= 0.10.1.dev0",
  "babel >= 2.14.0,<3.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "reflex-i18n-"
fallback-version = "0.0.0dev0"
bump = true

[tool.hatch.build]
artifacts = ["_web/**"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
