name: examples
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.id || github.sha }}
  cancel-in-progress: true

# Only changes to the examples or to what drives them as benchmark fixtures run
# this workflow; changes to reflex itself are covered by the other test suites.
on:
  pull_request:
    paths:
      - "examples/**"
      - "packages/reflex-bench/**"
      - "scripts/hash_examples.py"
      - ".github/legacy/reflex-0.8.23/**"
      - ".github/workflows/examples.yml"
  push:
    branches: ["main"]
    paths:
      - "examples/**"
      - "packages/reflex-bench/**"
      - "scripts/hash_examples.py"
      - ".github/legacy/reflex-0.8.23/**"
      - ".github/workflows/examples.yml"

env:
  REFLEX_TELEMETRY_ENABLED: false
  REFLEX_CHECK_LATEST_VERSION: false

defaults:
  run:
    shell: bash

jobs:
  # The playground against this checkout, through the workspace environment.
  playground-head:
    name: playground-head
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # fetch-tags/fetch-depth: the workspace packages derive their versions from git.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: "3.14"
          run-uv-sync: true
      - name: Check the playground content hash
        run: uv run --no-sync python scripts/hash_examples.py --check
      # The playground is not a workspace member: --project points uv at the
      # workspace environment instead of the playground's own.
      - name: Show the reflex under test
        working-directory: examples/playground
        run: uv run --no-sync --project ../.. reflex --version
      - name: Compile the playground
        working-directory: examples/playground
        run: uv run --no-sync --project ../.. reflex compile

  # The oldest release the benchmarks are backfilled to, from a locked
  # environment so a new release of a transitive dependency cannot break it.
  playground-0_8_23:
    name: playground-0.8.23
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: "3.12"
      # The venv goes first on PATH, like an activated venv: reflex 0.8.23 runs
      # tools such as granian by name.
      - name: Install the locked reflex 0.8.23 environment
        run: |
          uv sync --locked --project .github/legacy/reflex-0.8.23
          echo "$GITHUB_WORKSPACE/.github/legacy/reflex-0.8.23/.venv/bin" >> "$GITHUB_PATH"
      - name: Show the reflex under test
        working-directory: examples/playground
        run: reflex --version
      - name: Compile the playground
        working-directory: examples/playground
        run: reflex compile
