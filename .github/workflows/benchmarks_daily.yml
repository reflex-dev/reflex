name: benchmarks-daily
permissions:
  contents: read

# The `daily` suite of reflex-bench on standard runners, for the trends of
# everything the macro runner does not measure: exact metrics (wire, size),
# memory, and the whole dimension matrix of the noise-tolerant timings. Free for
# a public repository. Each shard's result is appended to the benchmark-data
# branch. The runner type is fixed, since the CPU model is part of the machine
# profile id and a new CPU model starts new series; release backfills use the
# same label, so their points continue these series.
#
# Measured 2026-09-29 on ubuntu-24.04-arm (Neoverse-N2, 4 cores, profile
# linux-arm64-neoverse-n2-py3.12), two runs, whole job / `reflex-bench run`:
# lifecycle 6.2 / 5.5 min, memory 29.5 / 28.7, events 5.9 / 4.8, hmr 16.8 / 15.9,
# browser 3.4-4.2 / 2.8-3.0, wire+size 1.5-1.7 / 0.6. Setup before the run is
# 30-45 s (uv sync 10-14 s, chromium 15-35 s). Timeouts are about 1.5-2x that.

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

env:
  REFLEX_TELEMETRY_ENABLED: false
  REFLEX_CHECK_LATEST_VERSION: false

defaults:
  run:
    shell: bash

jobs:
  daily:
    name: daily (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lifecycle
            filters: "lifecycle.*"
            timeout: 15
          - shard: memory
            filters: "memory.*"
            timeout: 45
          - shard: events
            filters: "events.*"
            timeout: 15
          - shard: hmr
            filters: "hmr.*"
            timeout: 30
          - shard: browser
            filters: "browser.*"
            timeout: 10
          - shard: exact
            filters: "wire.* size.*"
            timeout: 10
    timeout-minutes: ${{ matrix.timeout }}
    runs-on: ubuntu-24.04-arm
    steps:
      # fetch-tags/fetch-depth: the workspace packages derive their versions from git.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      # Also installs Node, which reflex 0.9 uses to write the build's .gz files.
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: "3.12"
      - name: Install the harness
        run: uv sync --no-dev --group bench --extra db
      # The harness owns every cache a measured phase reads; none is restored.
      - name: Point the bench home at the job's temporary directory
        run: echo "REFLEX_BENCH_HOME=$RUNNER_TEMP/reflex-bench" >> "$GITHUB_ENV"
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install chromium
        run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - name: Check the machine
        run: uv run --no-sync reflex-bench doctor
      # set -f: the filters are globs for reflex-bench, not for the shell.
      - name: Run the shard
        env:
          FILTERS: ${{ matrix.filters }}
          SHARD: ${{ matrix.shard }}
          # Manual dispatches are ad-hoc runs, kept out of the daily series.
          RUN_KIND: ${{ github.event_name == 'schedule' && 'daily' || 'ci' }}
        run: |
          set -f
          # shellcheck disable=SC2086
          uv run --no-sync reflex-bench run --suite daily $FILTERS --kind "$RUN_KIND" \
            --json "$SHARD.json" --no-save --fail-on never
      - name: Summarize
        if: always() && hashFiles(format('{0}.json', matrix.shard)) != ''
        env:
          SHARD: ${{ matrix.shard }}
        run: uv run --no-sync reflex-bench export "$SHARD.json" --to md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-${{ matrix.shard }}
          path: ${{ matrix.shard }}.json
          if-no-files-found: ignore

  # Every shard that produced a result lands in the history, also when another
  # shard failed.
  history:
    needs: daily
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: daily-*
          path: results
          merge-multiple: true
      - name: List the results
        id: results
        run: |
          shopt -s nullglob
          files=(results/*.json)
          echo "files=${files[*]}" >> "$GITHUB_OUTPUT"
      - if: steps.results.outputs.files != ''
        uses: ./.github/actions/bench_history
        with:
          results: ${{ steps.results.outputs.files }}
