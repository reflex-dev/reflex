name: benchmarks-daily
run-name: "Release comparison: Reflex 0.9.12 vs 0.10.0"
permissions:
  contents: read

# One-off release comparison on this branch; the scheduled workflow stays on main.
on:
  workflow_dispatch:

env:
  REFLEX_TELEMETRY_ENABLED: false
  REFLEX_CHECK_LATEST_VERSION: false

defaults:
  run:
    shell: bash

jobs:
  comparison:
    name: comparison (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lifecycle
            filters: "lifecycle.*"
          - shard: memory-core
            filters: "memory.compile.peak memory.idle memory.dev.idle memory.boot_512mb"
          - shard: memory-sessions
            filters: "memory.per_session"
          - shard: memory-leak
            filters: "memory.leak"
          - shard: events
            filters: "events.*"
          - shard: hmr
            filters: "hmr.*"
          - shard: browser
            filters: "browser.*"
          - shard: exact
            filters: "wire.* size.*"
    timeout-minutes: 120
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: "3.12"
      - name: Install the harness
        run: uv sync --frozen --no-dev --group bench --extra db
      - name: Prepare output and an isolated bench home
        run: |
          mkdir -p results
          echo "REFLEX_BENCH_HOME=$RUNNER_TEMP/reflex-bench" >> "$GITHUB_ENV"
          git rev-parse HEAD > results/harness-commit.txt
          uv --version > results/uv-version.txt
          node --version > results/node-version.txt
          uv pip freeze > results/harness-requirements.txt
      - name: Install chromium
        run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - name: Check the machine and record the suite
        run: |
          uv run --no-sync reflex-bench doctor | tee results/doctor.txt
          uv run --no-sync reflex-bench list --suite daily > results/suite.txt
      - name: Prepare and record the published subjects
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          from reflex_bench.subjects import resolve

          for version in ("0.9.12", "0.10.0"):
              subject = resolve(version, python="3.12", home=Path(os.environ["REFLEX_BENCH_HOME"]))
              assert subject.reflex_version == version, subject
              # The playground's database requires SQLAlchemy's async extra on ARM64.
              subprocess.run(
                  ["uv", "pip", "install", "--python", str(subject.python), "sqlalchemy[asyncio]"], check=True
              )
              subprocess.run(["uv", "pip", "check", "--python", str(subject.python)], check=True)
              packages = subprocess.check_output(
                  ["uv", "pip", "list", "--python", str(subject.python), "--format", "json"], text=True
              )
              installed = {p["name"]: p["version"] for p in json.loads(packages)}
              assert installed["reflex-base"] == version, installed
              Path(f"results/{version}-packages.json").write_text(packages)
              requirements = subprocess.check_output(
                  ["uv", "pip", "freeze", "--python", str(subject.python)], text=True
              )
              Path(f"results/{version}-requirements.txt").write_text(requirements)
          PY
      - name: Compare the published releases
        env:
          FILTERS: ${{ matrix.filters }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -f
          # shellcheck disable=SC2086
          uv run --no-sync reflex-bench ab --base 0.9.12 --head 0.10.0 \
            --python 3.12 --suite daily $FILTERS \
            --rounds 20 --order abba --seed 912100 --threshold 3 --alpha 0.01 \
            --json "results/$SHARD.json" --no-save --fail-on never \
            2>&1 | tee "results/$SHARD.log"
      - name: Summarize
        if: always() && hashFiles(format('results/{0}.json', matrix.shard)) != ''
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run --no-sync reflex-bench export "results/$SHARD.json" --to md \
            | tee "results/$SHARD.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check benchmark completion
        if: always() && hashFiles(format('results/{0}.json', matrix.shard)) != ''
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path

          doc = json.loads(Path(f"results/{os.environ['SHARD']}.json").read_text())
          incomplete = [entry for entry in doc["benchmarks"] if entry["status"] != "ok"]
          for entry in incomplete:
              print(entry["id"], entry["status"], entry.get("error"))
          assert not doc.get("interrupted") and not incomplete, "Some benchmarks did not complete; inspect the artifacts."
          PY
      - name: Upload results and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-comparison-${{ matrix.shard }}
          path: results/
          if-no-files-found: error
          retention-days: 90
