name: check-outdated-dependencies
permissions:
  contents: read

on:
  push: # This will trigger the action when a pull request is opened or updated.
    branches:
      - "release/**" # This will trigger the action when any branch starting with "release/" is created.
  workflow_dispatch: # Allow manual triggering if needed.

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: "3.13"
          run-uv-sync: true

      - name: Check outdated backend dependencies
        # Not `--script`: that resolves an isolated env, and `uv pip list` would then
        # inspect it instead of the project's synced environment.
        run: uv run python scripts/check_outdated_deps.py backend

  frontend:
    runs-on: ubuntu-latest
    env:
      # reflex-enterprise restricts `reflex run --env prod` to paid tiers but
      # exempts reflex's own integration tests via the app harness flag.
      APP_HARNESS_FLAG: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup_build_env
        with:
          python-version: "3.13"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Requirements for reflex-docs
        working-directory: ./docs/app
        run: uv sync
      - name: Init Website for reflex-docs
        working-directory: ./docs/app
        run: uv run --active --no-sync reflex init
      - name: Run Website and Check for errors
        run: |
          uv run --active --no-sync bash scripts/integration.sh ./docs/app prod
      - name: Check outdated frontend dependencies
        # `--script` here: this job only syncs docs/app, and the frontend check reads
        # bun and package.json rather than the Python environment.
        run: uv run --script scripts/check_outdated_deps.py frontend --web-dir ./docs/app/.web
