name: integration-app-harness

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.id || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
env:
  PYTHONUNBUFFERED: 1

permissions:
  contents: read

jobs:
  integration-app-harness-playwright:
    # Preserve the required check names while the consolidated matrix runs
    # all browser tests. Every alias fails if any matrix entry does not pass.
    needs: integration-app-harness
    if: ${{ always() }}
    strategy:
      matrix:
        state_manager: ["redis", "memory"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - name: Require the consolidated browser suite
        env:
          HARNESS_RESULT: ${{ needs.integration-app-harness.result }}
        run: test "$HARNESS_RESULT" = success

  integration-app-harness:
    timeout-minutes: 30
    strategy:
      matrix:
        state_manager: ["redis", "memory"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        split_index: [1, 2]
      fail-fast: false
    runs-on: ubuntu-22.04
    services:
      # Label used to access the service container
      redis:
        image: ${{ matrix.state_manager == 'redis' && 'redis' || '' }}
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: ${{ matrix.python-version }}
          run-uv-sync: true

      - name: Install playwright
        run: uv run playwright install chromium --only-shell

      - name: Diagnostics
        continue-on-error: true
        run: |
          uv pip list | grep -iE 'pytest|playwright|asyncio' || true
          uv run pytest --version
          uv run playwright --version
          ls -la ~/.cache/ms-playwright/ || true
          uv run python -c "import pytest_playwright; print('pytest_playwright loaded')"

      - name: Run app harness tests
        env:
          REFLEX_REDIS_URL: ${{ matrix.state_manager == 'redis' && 'redis://localhost:6379' || '' }}
        # Disable pytest-asyncio: sync Playwright's session event loop can't
        # coexist with pytest-asyncio's runner.  None of the integration
        # tests use `async def`, so the plugin is not needed.
        run: uv run pytest tests/integration -p no:asyncio --reruns 3 -v --maxfail=5 --splits 2 --group ${{matrix.split_index}}
