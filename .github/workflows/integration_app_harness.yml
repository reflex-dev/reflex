name: integration-app-harness

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.id || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: ["main"]
env:
  APP_HARNESS_HEADLESS: 1
  PYTHONUNBUFFERED: 1

permissions:
  contents: read

jobs:
  # This filter cannot live on the pull_request trigger: a workflow that a path
  # filter skips never reports its checks at all, so a branch rule requiring
  # them blocks the merge forever. Filtered out here, the jobs below skip
  # instead, and a skipped job reports as a pass.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/changed_paths
        id: filter
        with:
          paths-ignore: |
            **/*.md

  integration-app-harness:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 30
    strategy:
      matrix:
        state_manager: ["redis", "memory"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        split_index: [1, 2]
      fail-fast: false
    runs-on: ubuntu-22.04
    services:
      # Label used to access the service container
      redis:
        image: ${{ matrix.state_manager == 'redis' && 'redis' || '' }}
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: ${{ matrix.python-version }}
          run-uv-sync: true

      - name: Run app harness tests
        env:
          REFLEX_REDIS_URL: ${{ matrix.state_manager == 'redis' && 'redis://localhost:6379' || '' }}
        run: uv run pytest tests/integration --ignore=tests/integration/tests_playwright --reruns 3 -v --maxfail=5 --splits 2 --group ${{matrix.split_index}}

  # Playwright tests run in a separate job because the pytest-playwright plugin
  # keeps an asyncio event loop running on the main thread for the entire
  # session, which is incompatible with pytest-asyncio tests.
  integration-app-harness-playwright:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 30
    strategy:
      matrix:
        state_manager: ["redis", "memory"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
      fail-fast: false
    runs-on: ubuntu-22.04
    services:
      redis:
        image: ${{ matrix.state_manager == 'redis' && 'redis' || '' }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: ${{ matrix.python-version }}
          run-uv-sync: true

      - name: Install playwright
        run: uv run playwright install chromium --only-shell

      - name: Run playwright tests
        env:
          REFLEX_REDIS_URL: ${{ matrix.state_manager == 'redis' && 'redis://localhost:6379' || '' }}
        run: uv run pytest tests/integration/tests_playwright --reruns 3 -v --maxfail=5

  # The one status check the branch rules require from this workflow. Naming the
  # jobs above directly does not survive: check names follow the matrix and the
  # display names, and a job that a filter skips must not block the merge.
  integration-app-harness-gate:
    needs: [changes, integration-app-harness, integration-app-harness-playwright]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci_gate
        with:
          needs: ${{ toJSON(needs) }}
