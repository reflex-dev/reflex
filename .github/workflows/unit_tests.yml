name: unit-tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.id || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            uv run --no-project python -m scripts.unit_test_matrix --all >> "$GITHUB_OUTPUT"
          else
            # The full PR diff, including previous names, rather than just its last push.
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
              --jq '.[] | {filename, previous_filename} | tojson' |
              uv run --no-project python -m scripts.unit_test_matrix >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.matrix).suite }}
        # This suite intentionally collects nothing outside Linux.
        exclude:
          - os: windows-latest
            suite:
              name: reflex-bench
              path: packages/reflex-bench/tests/units
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      TEST_SUITE: ${{ matrix.suite.name }}
      PYTHONUNBUFFERED: "1"

    # Service containers to run with `runner-job`
    services:
      # Label used to access the service container
      redis:
        image: ${{ matrix.os == 'ubuntu-latest' && contains(fromJSON('["all","reflex","reflex-base"]'), matrix.suite.name) && 'redis' || '' }}
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379
      # reflex-workflow is built on Postgres and most of its suite needs a real
      # one; without this those tests skip, and the examples are not even
      # collected. Sixteen because that is the oldest the engine is reviewed
      # against, so a newer server's leniency cannot hide anything.
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && contains(fromJSON('["all","reflex-workflow"]'), matrix.suite.name) && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reflex_workflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: ${{ matrix.python-version }}
          run-uv-sync: true

      - name: Run unit tests without db dependencies
        if: contains(fromJSON('["all","reflex","reflex-base"]'), matrix.suite.name)
        run: |
          export PYTHONUNBUFFERED=1
          uv pip uninstall pydantic alembic sqlalchemy sqlmodel
          if [ "$TEST_SUITE" = all ]; then
            uv run --no-sync python -m scripts.run_unit_tests reflex -- --no-cov
            uv run --no-sync python -m scripts.run_unit_tests reflex-base -- --no-cov
          else
            uv run --no-sync python -m scripts.run_unit_tests $TEST_SUITE -- --no-cov
          fi
          uv sync
      - name: Run unit tests
        env:
          REFLEX_TEST_POSTGRES: ${{ matrix.os == 'ubuntu-latest' && contains(fromJSON('["all","reflex-workflow"]'), matrix.suite.name) && 'postgresql://postgres:postgres@localhost:5432/reflex_workflow' || '' }}
        run: |
          export PYTHONUNBUFFERED=1
          uv run python -m scripts.run_unit_tests $TEST_SUITE
      - name: Run unit tests w/ redis
        if: matrix.os == 'ubuntu-latest' && contains(fromJSON('["all","reflex","reflex-base"]'), matrix.suite.name)
        run: |
          export PYTHONUNBUFFERED=1
          export REFLEX_REDIS_URL=redis://localhost:6379
          if [ "$TEST_SUITE" = all ]; then
            uv run python -m scripts.run_unit_tests reflex
            uv run python -m scripts.run_unit_tests reflex-base
          else
            uv run python -m scripts.run_unit_tests $TEST_SUITE
          fi
      - name: Run unit tests w/ redis and OPLOCK_ENABLED
        if: matrix.os == 'ubuntu-latest' && contains(fromJSON('["all","reflex","reflex-base"]'), matrix.suite.name)
        run: |
          export PYTHONUNBUFFERED=1
          export REFLEX_REDIS_URL=redis://localhost:6379
          export REFLEX_OPLOCK_ENABLED=true
          if [ "$TEST_SUITE" = all ]; then
            uv run python -m scripts.run_unit_tests reflex
            uv run python -m scripts.run_unit_tests reflex-base
          else
            uv run python -m scripts.run_unit_tests $TEST_SUITE
          fi
      - name: Combine workspace coverage
        if: matrix.suite.name == 'all'
        run: |
          uv run coverage combine --keep
          uv run coverage report --keep-combined --fail-under=72

  unit-tests-macos:
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: ${{ matrix.python-version }}
          run-uv-sync: true

      - name: Run unit tests without db dependencies
        run: |
          export PYTHONUNBUFFERED=1
          uv pip uninstall pydantic alembic sqlalchemy sqlmodel
          uv run --no-sync python -m scripts.run_unit_tests reflex -- --no-cov
          uv run --no-sync python -m scripts.run_unit_tests reflex-base -- --no-cov
          uv sync
      - name: Run unit tests
        run: |
          export PYTHONUNBUFFERED=1
          uv run python -m scripts.run_unit_tests all
          uv run coverage combine --keep
          uv run coverage report --keep-combined --fail-under=72

  # The one status check the branch rules require from this workflow. Naming the
  # jobs above directly does not survive: check names follow the matrix and the
  # display names, and a job that a filter skips must not block the merge.
  unit-tests-gate:
    needs: [changes, unit-tests, unit-tests-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci_gate
        with:
          needs: ${{ toJSON(needs) }}
