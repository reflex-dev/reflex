name: docs tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      # Keep in sync with the changes job's filter below.
      - 'docs/**'
      - 'reflex/**'
      - 'packages/reflex-base/**'
      - 'packages/reflex-frontend/src/**'
      - 'packages/reflex-components-*/**'
      - 'packages/reflex-docgen/**'
      - 'packages/reflex-hosting-cli/**'
      - 'packages/reflex-build-sdk/**'
      - 'packages/hatch-reflex-pyi/**'
      - 'packages/reflex-site-shared/**'
      - 'packages/integrations-docs/**'
      - 'packages/*/CHANGELOG.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs_tests.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # This filter cannot live on the pull_request trigger: a workflow that a path
  # filter skips never reports its checks at all, so a branch rule requiring
  # them blocks the merge forever. Filtered out here, the jobs below skip
  # instead, and a skipped job reports as a pass.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/changed_paths
        id: filter
        with:
          # Everything the docs app and its tests import or read: the framework
          # and the components it documents, the frontend runtime reflex-base
          # embeds, docgen, the hosting CLI behind the cloud CLI reference and
          # the build SDK it imports, the shared site packages, the build
          # backend the component packages install with, and the changelogs
          # the changelog pages render.
          paths: |
            docs/**
            reflex/**
            packages/reflex-base/**
            packages/reflex-frontend/src/**
            packages/reflex-components-*/**
            packages/reflex-docgen/**
            packages/reflex-hosting-cli/**
            packages/reflex-build-sdk/**
            packages/hatch-reflex-pyi/**
            packages/reflex-site-shared/**
            packages/integrations-docs/**
            packages/*/CHANGELOG.md
            CHANGELOG.md
            pyproject.toml
            uv.lock
            .github/workflows/docs_tests.yml

  docs-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_build_env
        with:
          python-version: "3.12"
          run-uv-sync: true
          working-directory: ./docs/app
      - name: Run docs app tests
        working-directory: ./docs/app
        run: uv run --no-sync pytest tests/ -v

  # The one status check the branch rules require from this workflow. Naming the
  # jobs above directly does not survive: check names follow the matrix and the
  # display names, and a job that a filter skips must not block the merge.
  docs-tests-gate:
    needs: [changes, docs-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci_gate
        with:
          needs: ${{ toJSON(needs) }}
