# Generated by reflex-release; do not edit by hand.
# Re-run `uv run --frozen --package reflex-release reflex-release sync` after changing [tool.reflex-release] in
# pyproject.toml. `uv run --frozen --package reflex-release reflex-release sync --check` fails when this file drifts.
name: Dispatch release

# Kicks off a release by materializing news fragments into the selected
# packages' CHANGELOG.md files at the next version — the changelogs are the
# source of truth for publishing (see release_from_changelog.yml, which builds
# any changelog version that has no git tag yet and uploads it once the pypi
# environment deployment is approved).
#
# Selecting no package auto-selects the ones to release: those with pending
# news fragments — or, for release-from-prerelease, those whose changelog is
# topped by an alpha (the train's fragments are already consumed). Lockstep
# groups share one checkbox: their members only ever release together.
#
# Materializing also lifts each released package's unshippable dependency
# floors — a *.dev pin, and a prerelease pin when the version is final — to the
# earliest published version that satisfies them, re-locking the repository so
# the pins and the lock file land with the changelog bump. A package whose
# floor no published version satisfies is held back from the release instead.
#
# The package list is generated from [tool.reflex-release] — after adding or
# removing a package, re-run `uv run --frozen --package reflex-release reflex-release sync`.
#
# Prerelease actions (new-prerelease-*, continued-prerelease) write alpha
# versions and push them straight to an r/pre-<date> branch
# (continued prereleases push back to the r/pre-* branch the
# workflow was dispatched on); alphas build immediately and upload after pypi
# environment approval — no PR review involved. To pull new work into a
# prerelease train, merge main into the branch, then dispatch
# continued-prerelease on it.
#
# Release actions (release-*) open a pull request with the changelog changes
# instead — reviewing and merging that PR is how final versions land for
# publishing. The PR targets main, or the r/hotfix/**
# branch the workflow was dispatched on (hotfix branches may publish final
# versions directly). release-from-prerelease collapses the accumulated alpha
# sections into the single final-version section, so alpha headings never
# appear in a published final changelog.
#
# Materializing changelogs never publishes by itself: every upload — alphas
# included — additionally requires approval by the `pypi` environment's
# required reviewers (see publish.yml).
#
# REQUIRED CONFIGURATION:
# - The `pypi` environment must have required reviewers (asserted, fail
#   closed, by publish.yml).
# - "Allow GitHub Actions to create and approve pull requests" must be enabled
#   in the repo's Actions settings for release-* actions to open PRs.
# - Branch protection on main should require review; merging a
#   release PR is what lands final versions for publishing.
# - Recommended: a ruleset restricting who can create/push
#   r/pre-**, r/hotfix/** and
#   release/** branches to maintainers plus the github-actions[bot]
#   app (this workflow pushes as github-actions[bot] via GITHUB_TOKEN).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Release action"
        required: true
        type: choice
        # default is continued-prerelease to prevent accidental releases.
        default: continued-prerelease
        options:
          - new-prerelease-patch
          - new-prerelease-minor
          - new-prerelease-major
          - continued-prerelease
          - release-from-prerelease
          - release-post
          - release-patch
          - release-minor
          - release-major
      reflex:
        description: "reflex (with reflex-base)"
        type: boolean
        default: false
      hatch_reflex_pyi:
        description: "hatch-reflex-pyi"
        type: boolean
        default: false
      reflex_components_code:
        description: "reflex-components-code"
        type: boolean
        default: false
      reflex_components_core:
        description: "reflex-components-core"
        type: boolean
        default: false
      reflex_components_dataeditor:
        description: "reflex-components-dataeditor"
        type: boolean
        default: false
      reflex_components_gridjs:
        description: "reflex-components-gridjs"
        type: boolean
        default: false
      reflex_components_lucide:
        description: "reflex-components-lucide"
        type: boolean
        default: false
      reflex_components_markdown:
        description: "reflex-components-markdown"
        type: boolean
        default: false
      reflex_components_moment:
        description: "reflex-components-moment"
        type: boolean
        default: false
      reflex_components_plotly:
        description: "reflex-components-plotly"
        type: boolean
        default: false
      reflex_components_radix:
        description: "reflex-components-radix"
        type: boolean
        default: false
      reflex_components_react_player:
        description: "reflex-components-react-player"
        type: boolean
        default: false
      reflex_components_recharts:
        description: "reflex-components-recharts"
        type: boolean
        default: false
      reflex_components_sonner:
        description: "reflex-components-sonner"
        type: boolean
        default: false
      reflex_docgen:
        description: "reflex-docgen"
        type: boolean
        default: false
      reflex_hosting_cli:
        description: "reflex-hosting-cli"
        type: boolean
        default: false
      reflex_i18n:
        description: "reflex-i18n"
        type: boolean
        default: false
      reflex_release:
        description: "reflex-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dispatch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          python-version: "3.14.7"
      - name: Plan versions
        id: plan
        env:
          ACTION: ${{ inputs.action }}
          # Each unselected package contributes an empty string, so selecting
          # nothing leaves PACKAGES blank and the planner auto-selects.
          PACKAGES: >-
            ${{ inputs.reflex && 'reflex,reflex-base' || '' }}
            ${{ inputs.hatch_reflex_pyi && 'hatch-reflex-pyi' || '' }}
            ${{ inputs.reflex_components_code && 'reflex-components-code' || '' }}
            ${{ inputs.reflex_components_core && 'reflex-components-core' || '' }}
            ${{ inputs.reflex_components_dataeditor && 'reflex-components-dataeditor' || '' }}
            ${{ inputs.reflex_components_gridjs && 'reflex-components-gridjs' || '' }}
            ${{ inputs.reflex_components_lucide && 'reflex-components-lucide' || '' }}
            ${{ inputs.reflex_components_markdown && 'reflex-components-markdown' || '' }}
            ${{ inputs.reflex_components_moment && 'reflex-components-moment' || '' }}
            ${{ inputs.reflex_components_plotly && 'reflex-components-plotly' || '' }}
            ${{ inputs.reflex_components_radix && 'reflex-components-radix' || '' }}
            ${{ inputs.reflex_components_react_player && 'reflex-components-react-player' || '' }}
            ${{ inputs.reflex_components_recharts && 'reflex-components-recharts' || '' }}
            ${{ inputs.reflex_components_sonner && 'reflex-components-sonner' || '' }}
            ${{ inputs.reflex_docgen && 'reflex-docgen' || '' }}
            ${{ inputs.reflex_hosting_cli && 'reflex-hosting-cli' || '' }}
            ${{ inputs.reflex_i18n && 'reflex-i18n' || '' }}
            ${{ inputs.reflex_release && 'reflex-release' || '' }}
        shell: bash
        run: uv run --frozen --package reflex-release reflex-release plan
      - name: Materialize changelogs
        id: materialize
        env:
          ACTION: ${{ inputs.action }}
          RELEASES_JSON: ${{ steps.plan.outputs.releases }}
        shell: bash
        run: uv run --frozen --package reflex-release reflex-release materialize
      - name: Push prerelease branch
        if: ${{ !startsWith(inputs.action, 'release-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ inputs.action }}
          REF_NAME: ${{ github.ref_name }}
          RELEASES_JSON: ${{ steps.plan.outputs.releases }}
          REPINNED_JSON: ${{ steps.materialize.outputs.repinned }}
        shell: bash
        run: uv run --frozen --package reflex-release reflex-release push-prerelease
      - name: Open release pull request
        if: ${{ startsWith(inputs.action, 'release-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ inputs.action }}
          REF_NAME: ${{ github.ref_name }}
          RELEASES_JSON: ${{ steps.plan.outputs.releases }}
          REPINNED_JSON: ${{ steps.materialize.outputs.repinned }}
        shell: bash
        run: uv run --frozen --package reflex-release reflex-release open-release-pr
